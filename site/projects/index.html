<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Projects by Tony Ghouse." />
    <meta name="theme-color" content="#f7f5f2" />
    <title>Projects — Tony Ghouse</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        document.documentElement.classList.toggle("dark", localStorage.getItem("tonyghouse-theme") === "dark");
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js" defer></script>
    <script src="/router.js" defer></script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-[#f7f5f2] font-sans text-stone-950 antialiased transition-colors duration-300 dark:bg-stone-950 dark:text-stone-100">
    <header class="sticky top-0 z-50 border-b border-stone-200/80 bg-[#f7f5f2]/85 backdrop-blur-xl dark:border-stone-800 dark:bg-stone-950/85">
      <div class="mx-auto flex min-h-20 max-w-6xl flex-wrap items-center justify-between gap-x-6 px-6 py-3">
        <a class="group flex items-center gap-3 font-semibold tracking-tight" href="/" aria-label="Tony Ghouse home">
          <span class="brand-mark h-9 w-9 text-stone-950 transition-transform duration-300 group-hover:-rotate-6 dark:text-stone-100" aria-hidden="true"></span>
          <span>Tony Ghouse</span>
        </a>

        <div class="flex items-center gap-2">
          <nav class="hidden sm:block" aria-label="Main navigation">
            <ul class="flex items-center gap-1 text-sm text-stone-600 dark:text-stone-400">
              <li><a class="rounded-full px-3 py-2 hover:bg-stone-200/70 hover:text-stone-950 dark:hover:bg-stone-800 dark:hover:text-stone-100" href="/">Home</a></li>
              <li><a class="rounded-full bg-stone-200/70 px-3 py-2 font-medium text-stone-950 dark:bg-stone-800 dark:text-stone-100" href="/projects/" aria-current="page">Projects</a></li>
              <li><a class="rounded-full px-3 py-2 hover:bg-stone-200/70 hover:text-stone-950 dark:hover:bg-stone-800 dark:hover:text-stone-100" href="/experience/">Experience</a></li>
              <li><a class="rounded-full px-3 py-2 hover:bg-stone-200/70 hover:text-stone-950 dark:hover:bg-stone-800 dark:hover:text-stone-100" href="/about/">About</a></li>
              <li><a class="rounded-full px-3 py-2 hover:bg-stone-200/70 hover:text-stone-950 dark:hover:bg-stone-800 dark:hover:text-stone-100" href="/blog/">Blog</a></li>
            </ul>
          </nav>

          <button class="grid h-10 w-10 cursor-pointer place-items-center rounded-full border border-stone-300 bg-white/70 text-stone-700 transition hover:border-rose-400 hover:text-rose-600 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-300 dark:hover:border-rose-500 dark:hover:text-rose-400" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M20.3 15.2A8.5 8.5 0 0 1 8.8 3.7 8.5 8.5 0 1 0 20.3 15.2Z" />
            </svg>
          </button>
        </div>

        <nav class="order-3 min-w-0 w-full overflow-x-auto sm:hidden" aria-label="Mobile navigation">
          <ul class="flex w-max min-w-full items-center justify-between gap-6 pt-2 text-xs text-stone-600 dark:text-stone-400">
            <li><a class="hover:text-stone-950 dark:hover:text-stone-100" href="/">Home</a></li>
            <li><a class="font-semibold text-stone-950 dark:text-stone-100" href="/projects/" aria-current="page">Projects</a></li>
            <li><a class="hover:text-stone-950 dark:hover:text-stone-100" href="/experience/">Experience</a></li>
            <li><a class="hover:text-stone-950 dark:hover:text-stone-100" href="/about/">About</a></li>
            <li><a class="hover:text-stone-950 dark:hover:text-stone-100" href="/blog/">Blog</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="relative grid min-h-[calc(100svh-128px)] place-items-center overflow-hidden px-6 py-24 text-center sm:min-h-[calc(100svh-80px)]">
      <div class="hero-grid absolute inset-0 -z-10" aria-hidden="true"></div>
      <div>
        <p class="mb-4 font-mono text-xs font-semibold uppercase tracking-[0.24em] text-rose-600 dark:text-rose-400">Tony Ghouse</p>
        <h1 class="text-5xl font-black tracking-[-0.055em] text-stone-950 sm:text-7xl dark:text-white">Projects<span class="text-rose-600 dark:text-rose-500">.</span></h1>
        <p class="mt-5 text-stone-500 dark:text-stone-400">Project details are coming soon.</p>
      </div>
    </main>
  </body>
</html>
